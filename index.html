<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd60a">
<title>Rota · Sites que levam o cliente até você</title>
<style>
  :root {
    /* claro: mapa amarelo, tinta preta */
    --bg: #ffd60a; --bg2: #ffe34d; --ink: #111111; --muted: #4d4400;
    --route: #111111; --on-route: #ffffff; --pin: #ffd60a; --pin-ink: #111111;
    --road: rgba(0,0,0,.12); --block: rgba(0,0,0,.07); --water: rgba(0,0,0,.10);
    --card: #fff0a0; --line: rgba(0,0,0,.3);
    --land:#f8f8f6; --blk:#e8eaed; --cream:#fef8e8; --ilha:#ffffff; --park:#cdeac0; --agua:#a9d3f5; --via:#aab9cc; --via-c:#93a5bf; --mestra:#fcd35a; --mestra-c:#e0a82e; --rotac:#ffd60a; --pt:#fcd35a; --pt-c:#e0a82e; --rotah:#ffffff; --rot:#6b665a;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html[data-theme="dark"] {
    /* escuro: mapa preto, rota amarela */
    --bg: #0b0b0b; --bg2: #1c1a10; --ink: #fff6cc; --muted: #b3a66a;
    --route: #ffd60a; --on-route: #0b0b0b; --pin: #ffd60a; --pin-ink: #111111;
    --road: rgba(255,214,10,.10); --block: rgba(255,214,10,.05); --water: rgba(255,214,10,.08);
    --card: #161509; --line: rgba(255,214,10,.28);
    --land:#1f2733; --blk:#293342; --cream:#2d3646; --ilha:#2b3547; --park:#243d38; --agua:#16253b; --via:#44526a; --via-c:#2f3b50; --mestra:#7a6a45; --mestra-c:#4a3f28; --rotac:#ffd60a; --pt:#ffd60a; --pt-c:transparent; --rotah:#0b0b0b; --rot:#9ca5b3;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; overflow-x: clip; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, var(--bg2), var(--bg) 72%);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    transition: background .4s, color .4s;
  }
  html.aberto { overflow: hidden; }
  button, a { touch-action: manipulation; font-family: inherit; }
  button:focus, a:focus { outline: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--route); outline-offset: 3px; }

  #tema {
    position: absolute; right: 14px; top: 18px;
    width: 40px; height: 40px; border-radius: 50%; padding: 0;
    border: 1.4px solid var(--ink); background: var(--land); color: var(--ink); opacity: .92;
    display: grid; place-items: center; cursor: pointer; z-index: 5;
  }
  #tema svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #tema .sol { display: none; }
  html[data-theme="dark"] #tema .sol { display: block; }
  html[data-theme="dark"] #tema .lua { display: none; }

  header { text-align: center; padding-top: 6px; margin-top: auto; }
  .eyebrow { position: relative; top: -14px; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--route); font-weight: 700; }
  h1 { position: relative; top: -10px; font-size: clamp(46px, 13vw, 80px); line-height: 1; margin: 6px 0 6px; font-weight: 800; letter-spacing: -.02em; }
  h1 .o { display: inline-block; height: .86em; width: auto; vertical-align: -.02em; margin: 0 .02em; overflow: visible; }
  h1 .pg { fill: var(--route); }
  h1 .ph { fill: var(--bg); }
  h1 i { font-style: normal; color: var(--route); }
  .sub { position: relative; top: -10px; font-size: clamp(14px, 3.6vw, 17px); color: var(--muted); margin: 0 auto; max-width: 26em; line-height: 1.45; }

  /* mapa */
  .mapa { position: relative; width: min(100%, 470px, calc((100dvh - 230px) * .714)); min-width: 270px; margin: 0; padding-top: 4px; }
  svg.m { display: block; width: 100%; overflow: visible; }
  svg.m * { outline: none; -webkit-user-select: none; user-select: none; }
  .papel { fill: var(--land); stroke: var(--line); stroke-width: 2; }
  .quadra { fill: var(--blk); }
  .parque { fill: var(--park); }
  .rio { fill: none; stroke: var(--agua); stroke-width: 24; stroke-linecap: round; }
  .cas { fill: none; stroke: var(--via-c); stroke-width: 14; stroke-linecap: round; }
  .rua { fill: none; stroke: var(--via); stroke-width: 11; stroke-linecap: round; }
  .nome-rua { font: 600 9px var(--sans); fill: var(--rot); letter-spacing: .18em; }

  .rota { fill: none; stroke: var(--rotac); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 9; opacity: 0; animation: fluxo 1.2s linear infinite; transition: opacity .3s; }
  @keyframes fluxo { to { stroke-dashoffset: -10; } }
  .rota.sel { opacity: 1; }

  .pino { cursor: pointer; }
  .pino .cabeca { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .25s; }
  .pino:hover .cabeca, .pino.sel .cabeca { transform: translateY(-5px) scale(1.12); }
  .pino .gota { fill: var(--pin); }
  .pino.sel .gota { fill: #ffb300; }
  .pino .ic { color: #111; fill: none; stroke: #111; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .pino .sombra { fill: #000; opacity: .5; }
  .pino .cabeca { filter: drop-shadow(0 3px 2.5px rgba(0,0,0,.5)); }
  .pino text { font: 700 14px var(--sans); fill: var(--ink); stroke: var(--land); stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .pino.sc text { stroke: none; }
  .pino .toque { fill: transparent; }

  .cas.anel { stroke: var(--via-c); stroke-width: 17px; }
  .rua.anel { stroke: var(--via); stroke-width: 14px; }
  .ilha { fill: var(--ilha); stroke: var(--via-c); stroke-width: 1.5; }
  .quadra .cr { fill: var(--cream); }
  .hub .lp { fill: var(--route); }
  .hub .lh { fill: var(--ilha); }
  .hub .ld { fill: var(--route); }
  .hub .lg { font: 800 19px var(--sans); fill: var(--ink); text-anchor: start; letter-spacing: -.01em; }

  .carro .corpo { fill: var(--route); stroke: var(--land); stroke-width: 2; }
  .carro .vidro { fill: var(--bg); opacity: .85; }
  .carro .roda { fill: var(--ink); }

  .bussola .bf { fill: var(--land); stroke: var(--ink); stroke-width: 1.4; opacity: .9; }
  .bussola .pn { fill: #e53935; stroke: none; }
  .bussola path { fill: var(--ink); stroke: none; stroke-width: 1.6; stroke-linejoin: round; }
  .bussola text { font: 800 11px var(--sans); fill: var(--ink); text-anchor: middle; }

  .dica { font-size: 13px; color: var(--muted); margin: 12px 0 auto; text-align: center; }
  footer { padding-top: 16px; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  footer b { color: var(--ink); }

  /* cartão da parada */
  #fundo { position: fixed; inset: 0; background: rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 10; }
  #cartao {
    position: fixed; left: 50%; bottom: 0; width: min(100%, 520px);
    transform: translate(-50%, 105%);
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 26px 26px 0 0; padding: 26px 24px calc(26px + env(safe-area-inset-bottom));
    transition: transform .4s cubic-bezier(.2, .8, .2, 1); z-index: 11; max-height: 88dvh; overflow: auto;
  }
  html.aberto #fundo { opacity: 1; pointer-events: auto; }
  html.aberto #cartao { transform: translate(-50%, 0); }
  #cartao .fechar { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 18px; cursor: pointer; }
  #cartao .tag { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--route); font-weight: 800; }
  #cartao h2 { font-size: 27px; line-height: 1.15; margin: 8px 40px 8px 0; font-weight: 800; }
  #cartao p { color: var(--muted); line-height: 1.55; margin: 0 0 12px; font-size: 15px; }
  #cartao ul { margin: 0 0 20px; padding: 0; list-style: none; }
  #cartao li { padding: 9px 0 9px 26px; position: relative; font-size: 15px; border-top: 1px dashed var(--line); }
  #cartao li::before { content: ""; position: absolute; left: 3px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--route); box-shadow: 0 0 0 3px var(--card), 0 0 0 4px var(--route); }
  #cartao li a { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 999px; background: var(--route); color: var(--on-route); font: 700 15px var(--sans); text-decoration: none; }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  @media (prefers-reduced-motion: reduce) {
    .rota, .hub .anel2 { animation: none; }
    * { transition-duration: .01s !important; }
  }
  html.pausa .rota, html.pausa .hub .anel2 { animation-play-state: paused; }
</style>
</head>

  var ICONES = {
    zap: '<circle cx="12" cy="12" r="10.3" fill="none"/><path transform="translate(12 12) scale(.56) translate(-12 -12)" fill="currentColor" stroke="none" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>',
    insta: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/>',
    site: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9.5h18"/><circle cx="6" cy="7.3" r=".4"/>',
    cartao: '<rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="8.5" cy="11" r="1.8"/><path d="M6 15.5c.6-1.6 4-1.6 5 0M14 10h4M14 13h3"/>',
    pessoas: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c3 0 5 2 5 5.3"/>',
    preco: '<path d="M4 4h8l8 8-8 8-8-8z"/><circle cx="8.5" cy="8.5" r="1"/>'
  };

  var rotasG = $('rotas'), pinosG = $('pinos'), carro = $('carro');
  var paths = [], pinos = [];
  var gCas = $('gCas'), gVia = $('gVia'), gHl = $('gHl');
  [['cas anel', gCas], ['rua anel', gVia]].forEach(function (c) {
    var r = document.createElementNS(NS, 'circle');
    r.setAttribute('cx', CX); r.setAttribute('cy', CY); r.setAttribute('r', R); r.setAttribute('class', c[0]);
    c[1].appendChild(r);
  });
  CONFIG.paradas.forEach(function (p, i) {
    var pa = document.createElementNS(NS, 'path');
    pa.setAttribute('d', POS[i].d); pa.setAttribute('class', 'rota');
    gHl.appendChild(pa); paths.push(pa);

    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'pino' + (['Sites', 'Orçamento', 'Cartão digital', 'Clientes'].indexOf(p.nome) >= 0 ? ' sc' : '')); g.setAttribute('role', 'button'); g.setAttribute('tabindex', '0');
    g.setAttribute('aria-label', p.nome);
    var x = POS[i].x, y = POS[i].y;
    g.innerHTML =
      '<ellipse class="sombra" cx="' + x + '" cy="' + (y + 12) + '" rx="12" ry="4"/>' +
      '<g class="cabeca">' +
        '<path class="gota" d="M' + x + ' ' + (y + 12) + ' C' + (x - 28) + ' ' + (y - 8) + ' ' + (x - 24) + ' ' + (y - 40) + ' ' + x + ' ' + (y - 40) + ' C' + (x + 24) + ' ' + (y - 40) + ' ' + (x + 28) + ' ' + (y - 8) + ' ' + x + ' ' + (y + 12) + ' Z"/>' +
        '<g class="ic" transform="translate(' + (x - 12) + ' ' + (y - 32) + ')">' + ICONES[p.icone] + '</g>' +
      '</g>' +
      '<text x="' + x + '" y="' + (y + 32) + '">' + p.nome + '</text>' +
      '<circle class="toque" cx="' + x + '" cy="' + (y - 12) + '" r="34"/>';
    pinosG.appendChild(g); pinos.push(g);
    g.addEventListener('click', function () { vai(i); });
    g.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); vai(i); }
    });
  });

  /* ---------- carro andando pelas ruas ---------- */
  var cur = -1, token = 0;
  var loc = { i: -1, a: Math.PI / 2 };         /* na rotatória (ângulo) ou numa rua (i, t) */
  var T2 = Math.PI * 2;
  function setCar(x, y, deg) {
    carro.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + deg.toFixed(1) + ') scale(.52)');
  }
  function posRua(path, len, sentido) {
    var L = path.getTotalLength();
    len = Math.max(0, Math.min(L, len));
    var a = path.getPointAtLength(len);
    var b = path.getPointAtLength(Math.max(0, Math.min(L, len - 1.5 * sentido)));
    setCar(a.x, a.y, Math.atan2(a.y - b.y, a.x - b.x) * 180 / Math.PI);
  }
  function suave(k) { return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }
  function anda(i, de, ate, ms, tk) {
    return new Promise(function (ok) {
      var path = paths[i], L = path.getTotalLength(), t0 = null, sentido = ate >= de ? 1 : -1;
      if (reduz) ms = 120;
      function f(t) {
        if (tk !== token) return ok(false);
        if (t0 === null) t0 = t;
        var k = Math.min(1, (t - t0) / ms), v = de + (ate - de) * suave(k);
        loc = { i: i, t: v };
        posRua(path, L * v, sentido);
        if (k < 1) requestAnimationFrame(f); else ok(true);
      }
      requestAnimationFrame(f);
    });
  }
  function posAnel(a) {
    setCar(CX + R * Math.cos(a), CY + R * Math.sin(a), Math.atan2(-Math.cos(a), Math.sin(a)) * 180 / Math.PI);
  }
  /* roda pela rotatória no sentido anti-horário */
  function giro(a0, a1, tk) {
    return new Promise(function (ok) {
      var m = (((a1 - a0) % T2) + T2) % T2;
      var delta = m < 1e-3 ? 0 : m - T2;
      posAnel(a0);
      if (!delta) { loc = { i: -1, a: a1 }; return ok(true); }
      var ms = reduz ? 120 : 250 + 700 * Math.abs(delta) / T2, t0 = null;
      function f(t) {
        if (tk !== token) return ok(false);
        if (t0 === null) t0 = t;
        var k = Math.min(1, (t - t0) / ms), a = a0 + delta * suave(k);
        loc = { i: -1, a: a };
        posAnel(a);
        if (k < 1) requestAnimationFrame(f); else ok(true);
      }
      requestAnimationFrame(f);
    });
  }
  function paraAnel(tk) {
    if (loc.i < 0) return Promise.resolve(true);
    var i = loc.i, t = loc.t;
    return anda(i, t, 0, Math.max(150, 650 * t), tk).then(function (ok) {
      if (ok) loc = { i: -1, a: EXIT[i] };
      return ok;
    });
  }
  function marca(i) {
    paths.forEach(function (p, k) { p.classList.toggle('sel', k === i); });
    pinos.forEach(function (p, k) { p.classList.toggle('sel', k === i); });
  }

  function cartao(i) {
    var p = CONFIG.paradas[i];
    $('ctag').textContent = p.tag;
    $('ct').textContent = p.titulo;
    $('cx').textContent = p.texto;
    $('cl').innerHTML = '';
    p.itens.forEach(function (t) {
      var li = document.createElement('li');
      if (typeof t === 'string') li.textContent = t;
      else {
        var l = document.createElement('a');
        l.href = t.url; l.target = '_blank'; l.rel = 'noopener'; l.textContent = t.t + ' ↗';
        li.appendChild(l);
      }
      $('cl').appendChild(li);
    });
    var b = p.botao, a = $('cb');
    a.href = b.tipo === 'insta' ? CONFIG.instagram : 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(b.msg || '');
    a.innerHTML = '<svg viewBox="0 0 24 24">' + ICONES[b.tipo === 'insta' ? 'insta' : 'zap'] + '</svg><span></span>';
    a.querySelector('span').textContent = b.texto;
  }

  function vai(i) {
    if (i === cur && H.classList.contains('aberto')) return;
    var tk = ++token;
    cur = i;
    marca(i);
    cartao(i);
    H.classList.add('aberto');           /* o cartão abre na hora; o carrinho segue viajando */
    var ate = (loc.i === i)
      ? Promise.resolve(true)
      : paraAnel(tk).then(function (ok) { return ok ? giro(loc.a, EXIT[i], tk) : false; });
    ate.then(function (ok) { return ok ? anda(i, loc.i === i ? loc.t : 0, 1, 1100, tk) : false; });
  }
  function volta() {
    H.classList.remove('aberto');
    if (cur < 0 && loc.i < 0) return;
    var tk = ++token;
    cur = -1;
    marca(-1);
    paraAnel(tk);
  }
  $('fechar').addEventListener('click', volta);
  $('fundo').addEventListener('click', volta);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') volta(); });

  /* tema claro / escuro */
  function aplicaTema(t) {
    H.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0b0b0b' : '#ffd60a');
  }
  try {
    var salvo = localStorage.getItem('rota-tema');
    if (salvo === 'light' || salvo === 'dark') aplicaTema(salvo);
  } catch (e) {}
  $('tema').addEventListener('click', function () {
    var t = H.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    aplicaTema(t);
    try { localStorage.setItem('rota-tema', t); } catch (e) {}
  });

  document.addEventListener('visibilitychange', function () { H.classList.toggle('pausa', document.hidden); });
})();
</script>
